name: local_link_web
description: A map-based social discovery app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ───────────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2       # profile photo storage

  # ── Media ──────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2            # camera / gallery picker
  cached_network_image: ^3.4.1    # efficient network image display

  # ── Map ────────────────────────────────────────────────────────────────────
  flutter_map: ^8.2.2
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  flutter_compass: ^0.8.0

  # ── Misc ───────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.1.1
  crypto: ^3.0.3
  http: ^1.2.0
  url_launcher: ^6.2.0
  webview_flutter: ^4.4.0
  timeago: ^3.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

